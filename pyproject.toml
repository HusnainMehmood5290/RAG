[project]
name = "parent-retrieval-rag"
version = "1.0.0"
description = "RAG chatbot using LangChain ParentDocumentRetriever for exact document answers"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008"]  # function call in default arg (typer-style DI not used here)

[tool.ruff.lint.isort]
known-first-party = ["config", "logging_config", "models", "rag", "ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
